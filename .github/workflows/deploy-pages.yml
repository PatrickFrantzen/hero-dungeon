name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npx ng build --base-href /hero-dungeon/

      - run: cp dist/hero-dungeon/index.html dist/hero-dungeon/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/hero-dungeon
          publish_branch: gh-pages
          # keep_files: sonst würde dieser Prod-Deploy (Root der gh-pages-Branch) den dev/-
          # Unterordner aus deploy-pages-dev.yml bei jedem Push auf main mit löschen, weil
          # peaceiris/actions-gh-pages den Zielbranch standardmäßig komplett ersetzt.
          keep_files: true
