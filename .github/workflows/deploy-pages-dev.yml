# Dev-Vorschau unter https://<owner>.github.io/hero-dungeon/dev/ - Pendant zu
# deploy-pages.yml, aber getriggert vom dev-Branch statt main und in einen Unterordner
# (destination_dir: dev) statt in die Root der gh-pages-Branch veröffentlicht, damit Prod
# (main → Root) unberührt bleibt. Nutzt dieselbe Firebase-Instanz wie Prod (environment.ts/
# environment.prod.ts zeigen auf dasselbe Firebase-Projekt "hero-dungeon") - keine separate
# Dev-Datenbank, bewusste Entscheidung (Abstimmung mit Patrick, 2026-09-03).
name: Deploy dev preview to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npx ng build --base-href /hero-dungeon/dev/

      - run: cp dist/hero-dungeon/index.html dist/hero-dungeon/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/hero-dungeon
          publish_branch: gh-pages
          destination_dir: dev
          # keep_files: lässt den Prod-Inhalt (Root der gh-pages-Branch, aus deploy-pages.yml)
          # unangetastet - ohne das würde dieser Dev-Deploy die gesamte gh-pages-Branch auf
          # nur noch den dev/-Ordner reduzieren.
          keep_files: true
