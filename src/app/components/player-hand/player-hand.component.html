<div class="card-area">
  @if (loadError()) {
    <div class="player-hand-error">{{ loadError() }}</div>
  }

  @if (isEventActive()) {
    <button
      class="event-button tw-rounded tw-bg-green-600 tw-px-3 tw-py-1.5 tw-text-sm tw-font-medium tw-text-white tw-shadow tw-transition-colors hover:tw-bg-green-500"
      (click)="resolveEvent()"
    >Event ausführen</button>
  }

  <div class="card-stack" title="Karten im Nachziehstapel">
    <img src="./assets/img/cards/monster.png" alt="Nachziehstapel" loading="lazy" decoding="async">
    <span class="card-stack-badge">{{ currentCardStack().length }}</span>
  </div>

    <div class="currentHandStack">
      @for (card of currentHand() ; track card; let i = $index) {
        <div class="hand-card" [ngStyle]="handCardStyle(i)" [class.dragging]="draggingIndex() === i">
          <img
            (click)="chooseCard(card)"
            (touchstart)="onCardTouchStart($event, i)"
            (touchmove)="onCardTouchMove($event, i)"
            (touchend)="onCardTouchEnd($event, i, card)"
            (touchcancel)="onCardTouchCancel(i)"
            [class.joker-card--active]="card === 'joker' && jokerSelectionActive()"
            src="./assets/img/cards/{{card}}.png" alt="{{card}}" decoding="async">
          @if (isSingleplayer()) {
            <button
              class="rest-button tw-rounded-full tw-bg-purple-700/90 tw-px-2 tw-py-0.5 tw-text-[10px] tw-font-medium tw-text-white tw-shadow tw-transition-colors hover:tw-bg-purple-600"
              (click)="restCard(card)"
            >Rasten</button>
          }
        </div>
        }
      </div>

      <app-heropower-container (heropowerResolved)="onHeropowerResolved($event)"></app-heropower-container>
    </div>
