<div class="card-area">
  <div class="card-stack">
    @for (c of [0,1,2,3]; track c; let i = $index) {
      <img [ngStyle]="{'left.px': i * 5}"
        src="./assets/img/cards/monster.png">
      }
    </div>

    <div class="currentHandStack">
      @for (card of currentHand() ; track card; let x = $index) {
        <img (click)="chooseCard(card)"
          [ngStyle]="{'left.px': x * 170}"  src="./assets/img/cards/{{card}}.png">
        }
      </div>

      <app-heropower-container></app-heropower-container>
    </div>
