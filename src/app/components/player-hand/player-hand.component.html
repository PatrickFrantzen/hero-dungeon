<div class="card-area">
  @if (loadError()) {
    <div class="player-hand-error">{{ loadError() }}</div>
  }

  @if (isEventActive()) {
    <button
      class="event-button tw-rounded tw-bg-green-600 tw-px-3 tw-py-1.5 tw-text-sm tw-font-medium tw-text-white tw-shadow tw-transition-colors hover:tw-bg-green-500"
      (click)="resolveEvent()"
    >Event ausführen</button>
  }

  <div class="card-stack">
    @for (c of [0,1,2,3]; track c; let i = $index) {
      <img [ngStyle]="{'left.px': i * 5}"
        src="./assets/img/cards/monster.png">
      }
    </div>

    <div class="currentHandStack">
      @for (card of currentHand() ; track card) {
        <div class="hand-card">
          <img (click)="chooseCard(card)" src="./assets/img/cards/{{card}}.png">
          @if (isSingleplayer()) {
            <button
              class="rest-button tw-rounded tw-bg-purple-700 tw-px-2 tw-py-1 tw-text-xs tw-font-medium tw-text-white tw-transition-colors hover:tw-bg-purple-600"
              (click)="restCard(card)"
            >Rasten</button>
          }
        </div>
        }
      </div>

      <app-heropower-container (heropowerResolved)="onHeropowerResolved($event)"></app-heropower-container>
    </div>
