<div class="mainfield">
    <h1>Willkommen {{ currentUserName() }}</h1>
    <div class="start-label-box">
        
            <button (click)="newGame()">Neues Spiel</button>
            <input type="text" [(ngModel)]="joinGameId" placeholder="Name eines existierenden Spiels eingeben">
            <button (click)="joinGame()">Join Game</button>
            <button (click)="logout()">Logout</button>

        @if (startscreenError) {
            <p class="error-message">{{ startscreenError }}</p>
        }

    </div>
</div>
