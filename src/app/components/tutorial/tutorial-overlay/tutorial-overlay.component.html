@if (active() && step(); as s) {
  <div class="tutorial-overlay">
    @if (spotlightRect(); as rect) {
      <div
        class="tutorial-spotlight"
        [ngStyle]="{
          top: (rect.top - 8) + 'px',
          left: (rect.left - 8) + 'px',
          width: (rect.width + 16) + 'px',
          height: (rect.height + 16) + 'px'
        }"
      ></div>
    } @else {
      <div class="tutorial-dim"></div>
    }

    <div class="tutorial-card tw-rounded-lg tw-bg-black/85 tw-p-5 tw-text-white tw-shadow-lg">
      <p class="tw-mb-1 tw-text-xs tw-uppercase tw-tracking-wide tw-text-white/60">
        Schritt {{ stepNumber() }} von {{ totalSteps() }}
      </p>
      <h2 class="tw-mb-2 tw-text-lg tw-font-semibold">{{ s.title }}</h2>
      <p class="tw-mb-4 tw-text-sm tw-text-white/90">{{ s.body }}</p>

      <div class="tw-flex tw-items-center tw-justify-between tw-gap-3">
        <button
          type="button"
          class="tw-rounded tw-border tw-border-white/40 tw-bg-transparent tw-px-3 tw-py-1.5 tw-text-sm tw-text-white/80 tw-transition-colors hover:tw-bg-white/10"
          (click)="skip.emit()"
        >Überspringen</button>

        <div class="tw-flex tw-gap-2">
          @if (!isFirstStep()) {
            <button
              type="button"
              class="tw-rounded tw-bg-white/10 tw-px-3 tw-py-1.5 tw-text-sm tw-font-medium tw-text-white tw-transition-colors hover:tw-bg-white/20"
              (click)="previous.emit()"
            >Zurück</button>
          }
          <button
            type="button"
            class="tw-rounded tw-bg-purple-700 tw-px-4 tw-py-1.5 tw-text-sm tw-font-medium tw-text-white tw-transition-colors hover:tw-bg-purple-600"
            (click)="next.emit()"
          >{{ isLastStep() ? 'Fertig' : 'Weiter' }}</button>
        </div>
      </div>
    </div>
  </div>
}
