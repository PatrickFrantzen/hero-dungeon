<mat-card class="current-Enemy">
  <mat-card-header>{{ currentEnemy().name }}</mat-card-header>
  <mat-card-content>
    @for (token of currentEnemy().token; track token; let x = $index) {
      <img src="./assets/img/monsterToken/{{token}}.png">
    }
  </mat-card-content>
  <mat-card-footer>{{currentEnemy().type}}

  </mat-card-footer>
</mat-card>
